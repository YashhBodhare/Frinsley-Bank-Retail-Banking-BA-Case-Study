<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title>Transfer review and status — wireframe</title><desc>Low-fidelity mobile transfer review and illustrative status card.</desc><rect width="390" height="844" rx="30" fill="#f4f7fa"/><rect x="0" y="0" width="390" height="42" rx="25" fill="#ffffff"/><text x="22" y="27" class="tiny bold">9:41</text><text x="335" y="27" class="tiny">● ● ▰</text><style>text{font-family:Arial,Helvetica,sans-serif;fill:#142c3d} .tiny{font-size:11px} .small{font-size:13px} .body{font-size:15px} .title{font-size:22px;font-weight:700} .bold{font-weight:700} .muted{fill:#6d7d89} .brand{fill:#123b5d} .white{fill:#ffffff} .line{stroke:#d9e1e8;stroke-width:1} .field{fill:#ffffff;stroke:#c9d4de;stroke-width:1.4} .card{fill:#ffffff;stroke:#dde5eb;stroke-width:1} .button{fill:#123b5d} .accent{fill:#e6f2f4} .teal{fill:#087f8c} .badge{fill:#eaf4ef} .warning{fill:#fff5df}</style><rect x="0" y="42" width="390" height="62" fill="#123b5d"/><text x="22" y="80" class="body bold white">Frinsley Bank</text><text x="350" y="80" class="body white">⋯</text>
<text x="24" y="139" class="small teal">‹ Edit transfer</text><text x="24" y="177" class="title">Review transfer</text><text x="24" y="203" class="small muted">Check details before confirmation</text>
<rect x="24" y="228" width="342" height="300" rx="14" class="card"/><text x="42" y="266" class="tiny muted">TRANSFER TYPE</text><text x="42" y="291" class="small bold">Selected rail</text><line x1="42" y1="309" x2="348" y2="309" class="line"/><text x="42" y="340" class="tiny muted">TO</text><text x="42" y="365" class="small bold">Destination name ·•••• 1234</text><line x1="42" y1="384" x2="348" y2="384" class="line"/><text x="42" y="416" class="tiny muted">FROM</text><text x="42" y="441" class="small bold">Everyday account ·•••• 4821</text><line x1="42" y1="460" x2="348" y2="460" class="line"/><text x="42" y="496" class="tiny muted">AMOUNT / FEES / EXPECTED TIMING</text><text x="42" y="516" class="tiny muted">Shown according to approved policy</text>
