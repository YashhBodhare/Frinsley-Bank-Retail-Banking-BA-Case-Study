<rect x="24" y="631" width="342" height="88" rx="12" class="badge"/><text x="42" y="662" class="small bold">Illustrative result state</text><text x="42" y="685" class="tiny muted">Completed / pending / rejected + reference</text><text x="42" y="703" class="tiny muted">must come from the authoritative service.</text>
<text x="24" y="758" class="tiny muted">Prototype wireframe only — no transaction is sent.</text></svg>
