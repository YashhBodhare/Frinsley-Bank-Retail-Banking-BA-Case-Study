<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title>Sign in — retail banking wireframe</title><desc>Low-fidelity mobile sign-in screen with secure access, help, and recovery options.</desc><rect width="390" height="844" rx="30" fill="#f4f7fa"/><rect x="0" y="0" width="390" height="42" rx="25" fill="#ffffff"/><text x="22" y="27" class="tiny bold">9:41</text><text x="335" y="27" class="tiny">● ● ▰</text><style>text{font-family:Arial,Helvetica,sans-serif;fill:#142c3d} .tiny{font-size:11px} .small{font-size:13px} .body{font-size:15px} .title{font-size:22px;font-weight:700} .bold{font-weight:700} .muted{fill:#6d7d89} .brand{fill:#123b5d} .white{fill:#ffffff} .line{stroke:#d9e1e8;stroke-width:1} .field{fill:#ffffff;stroke:#c9d4de;stroke-width:1.4} .card{fill:#ffffff;stroke:#dde5eb;stroke-width:1} .button{fill:#123b5d} .accent{fill:#e6f2f4} .teal{fill:#087f8c} .badge{fill:#eaf4ef} .warning{fill:#fff5df}</style><rect x="0" y="42" width="390" height="62" fill="#123b5d"/><text x="22" y="80" class="body bold white">Frinsley Bank</text><text x="350" y="80" class="body white">⋯</text>
<text x="24" y="157" class="title">Welcome back</text><text x="24" y="184" class="small muted">Sign in to access your banking services</text>
<text x="24" y="235" class="small bold">Customer ID</text><rect x="24" y="249" width="342" height="52" rx="10" class="field"/><text x="40" y="281" class="small muted">Enter customer ID</text>
<text x="24" y="332" class="small bold">Password</text><rect x="24" y="346" width="342" height="52" rx="10" class="field"/><text x="40" y="378" class="small muted">Enter password</text><text x="324" y="378" class="small teal">Show</text>
<text x="244" y="427" class="small teal">Forgot details?</text><rect x="24" y="458" width="342" height="54" rx="12" class="button"/><text x="168" y="492" class="body bold white">Sign in</text>
<rect x="24" y="539" width="342" height="78" rx="12" class="accent"/><text x="42" y="571" class="small bold">Security check</text><text x="42" y="594" class="tiny muted">Additional verification may be required.</text>
<text x="24" y="689" class="small teal">Need help signing in?</text><text x="24" y="738" class="tiny muted">Access method and verification steps are placeholders</text><text x="24" y="755" class="tiny muted">until approved by the bank's security team.</text></svg>
