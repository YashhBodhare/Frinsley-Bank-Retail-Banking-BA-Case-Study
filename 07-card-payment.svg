<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title>Credit-card payment — wireframe</title><desc>Low-fidelity mobile credit-card balance payment flow.</desc><rect width="390" height="844" rx="30" fill="#f4f7fa"/><rect x="0" y="0" width="390" height="42" rx="25" fill="#ffffff"/><text x="22" y="27" class="tiny bold">9:41</text><text x="335" y="27" class="tiny">● ● ▰</text><style>text{font-family:Arial,Helvetica,sans-serif;fill:#142c3d} .tiny{font-size:11px} .small{font-size:13px} .body{font-size:15px} .title{font-size:22px;font-weight:700} .bold{font-weight:700} .muted{fill:#6d7d89} .brand{fill:#123b5d} .white{fill:#ffffff} .line{stroke:#d9e1e8;stroke-width:1} .field{fill:#ffffff;stroke:#c9d4de;stroke-width:1.4} .card{fill:#ffffff;stroke:#dde5eb;stroke-width:1} .button{fill:#123b5d} .accent{fill:#e6f2f4} .teal{fill:#087f8c} .badge{fill:#eaf4ef} .warning{fill:#fff5df}</style><rect x="0" y="42" width="390" height="62" fill="#123b5d"/><text x="22" y="80" class="body bold white">Frinsley Bank</text><text x="350" y="80" class="body white">⋯</text>
<text x="24" y="139" class="small teal">‹ Card details</text><text x="24" y="177" class="title">Pay card balance</text><text x="24" y="203" class="small muted">Select card, source and amount</text>
<rect x="24" y="228" width="342" height="68" rx="12" class="card"/><text x="42" y="255" class="tiny muted">PAYMENT TO</text><text x="42" y="280" class="small bold">Rewards card ·•••• 9012</text>
<text x="24" y="338" class="small bold">Pay from</text><rect x="24" y="351" width="342" height="52" rx="10" class="field"/><text x="42" y="383" class="small">Choose an eligible account</text><text x="339" y="383" class="small teal">⌄</text>
<text x="24" y="435" class="small bold">Payment amount</text><rect x="24" y="448" width="342" height="52" rx="10" class="field"/><text x="42" y="480" class="small muted">Choose or enter amount</text><text x="339" y="480" class="small teal">⌄</text>
<rect x="24" y="520" width="342" height="103" rx="12" class="accent"/><text x="42" y="550" class="small bold">Payment rules to confirm</text><text x="42" y="575" class="tiny muted">Allowed amounts, payment allocation, posting</text><text x="42" y="594" class="tiny muted">time, limits and required verification.</text>
<rect x="24" y="647" width="342" height="54" rx="12" class="button"/><text x="154" y="681" class="body bold white">Review payment</text>
<text x="24" y="740" class="tiny muted">Review screen should show card, source, amount</text><text x="24" y="758" class="tiny muted">and authoritative result after submission.</text></svg>
